name: Build M-Chip DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-macOS-arm64:
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Version String
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "asr_server/requirements.txt" ]; then
            REQ_FILE="asr_server/requirements.txt"
          elif [ -f "requirements.txt" ]; then
            REQ_FILE="requirements.txt"
          else
            echo "❌ 未找到 requirements.txt（asr_server/ 与仓库根目录均未找到）"
            exit 1
          fi
          echo "📦 使用依赖文件: $REQ_FILE"
          pip install pyinstaller -r "$REQ_FILE"

      - name: Build ASR Server Executable (ARM64)
        run: |
          cd asr_server
          pyinstaller --clean --onefile --name asr_server \
            --collect-all funasr \
            --collect-all faster_whisper \
            --collect-all torch \
            --collect-all ctranslate2 \
            server.py

      - name: Install create-dmg tool
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg

      - name: Build SwiftUI App for Apple Silicon
        run: |
          cd HermeneusApp
          VERSION="${{ steps.version.outputs.VERSION }}"
          XCODEPROJ=$(find . -name "*.xcodeproj" -not -path "*/.*" | head -n 1)
          SWIFTPKG=$(find . -name "Package.swift" -not -path "*/.*" | head -n 1)

          if [ -n "$XCODEPROJ" ]; then
            SCHEME_NAME=$(xcodebuild -list -project "$XCODEPROJ" | grep -A 10 "Schemes:" | tail -n +2 | tr -d " " | head -n 1)
            echo "🚀 递归检索到 Xcode 工程: $XCODEPROJ, 提取 Scheme: $SCHEME_NAME"
            xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME_NAME" -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -arch arm64 SWIFT_STRICT_CONCURRENCY=minimal
          elif [ -n "$SWIFTPKG" ]; then
            PKG_DIR=$(dirname "$SWIFTPKG")
            echo "🚀 递归检索到 Swift Package 目录: $PKG_DIR"
            cd "$PKG_DIR"
            swift build -c release --arch arm64 -Xswiftc -strict-concurrency=minimal

            EXECUTABLE_NAME="AILiveInterpreterApp"
            APP_NAME="Hermeneus"
            APP_BUNDLE="${APP_NAME}.app"
            BIN_PATH=$(swift build -c release --arch arm64 --show-bin-path)

            echo "📦 手动组装 .app bundle: $PKG_DIR/$APP_BUNDLE"
            rm -rf "$APP_BUNDLE"
            mkdir -p "$APP_BUNDLE/Contents/MacOS"
            mkdir -p "$APP_BUNDLE/Contents/Resources"

            cp "$BIN_PATH/$EXECUTABLE_NAME" "$APP_BUNDLE/Contents/MacOS/$EXECUTABLE_NAME"

            if [ -d "$BIN_PATH/${EXECUTABLE_NAME}_${EXECUTABLE_NAME}.bundle" ]; then
              cp -R "$BIN_PATH/${EXECUTABLE_NAME}_${EXECUTABLE_NAME}.bundle" "$APP_BUNDLE/Contents/Resources/"
            fi

            python3 -c "
          version = '${VERSION}'
          content = '''<?xml version=\"1.0\" encoding=\"UTF-8\"?>
          <!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">
          <plist version=\"1.0\">
          <dict>
              <key>CFBundleExecutable</key>
              <string>AILiveInterpreterApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.hermeneus.ailiveinterpreter</string>
              <key>CFBundleName</key>
              <string>Hermeneus</string>
              <key>CFBundleDisplayName</key>
              <string>Hermeneus</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>''' + version + '''</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>需要访问麦克风以进行实时语音同传</string>
          </dict>
          </plist>'''
          with open('$APP_BUNDLE/Contents/Info.plist', 'w', encoding='utf-8') as f:
              f.write(content.strip())
          "

            echo "✅ .app bundle 组装完成（未注入 asr_server，未签名）: $(pwd)/$APP_BUNDLE"
          else
            echo "❌ 未找到 Swift 项目！"
            exit 1
          fi

          APP_ABS_PATH=$(find "$(pwd)" -maxdepth 6 -name "*.app" -not -path "*/.*" | head -n 1)
          if [ -z "$APP_ABS_PATH" ]; then
            echo "❌ 未找到组装好的 .app！"
            exit 1
          fi
          echo "✅ APP_BUNDLE_PATH=$APP_ABS_PATH"
          echo "APP_BUNDLE_PATH=$APP_ABS_PATH" >> "$GITHUB_ENV"

      - name: Package Lite DMG (Swift app only)
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          LITE_STAGE="$RUNNER_TEMP/dmg_stage/lite"
          rm -rf "$LITE_STAGE" && mkdir -p "$LITE_STAGE"

          cp -R "$APP_BUNDLE_PATH" "$LITE_STAGE/"
          LITE_APP="$LITE_STAGE/$(basename "$APP_BUNDLE_PATH")"

          codesign --force --deep --sign - "$LITE_APP"

          create-dmg \
            --volname "Hermeneus (Lite)" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Hermeneus-v${VERSION}-Lite.dmg" \
            "$LITE_APP" || true

          if [ ! -f "Hermeneus-v${VERSION}-Lite.dmg" ]; then
            echo "❌ create-dmg 执行失败，且未生成 Lite DMG 产物"
            exit 1
          fi
          echo "✅ Lite DMG 产物校验通过: Hermeneus-v${VERSION}-Lite.dmg"

          zip -q -9 "Hermeneus-v${VERSION}-Lite.zip" "Hermeneus-v${VERSION}-Lite.dmg"
          if [ ! -f "Hermeneus-v${VERSION}-Lite.zip" ]; then
            echo "❌ ZIP 压缩失败，未生成 Lite ZIP 产物"
            exit 1
          fi
          echo "✅ Lite ZIP 压缩包生成完成: Hermeneus-v${VERSION}-Lite.zip"

      - name: Package Full DMG (Swift app + ASR engine)
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"
          ASR_BIN="$GITHUB_WORKSPACE/asr_server/dist/asr_server"

          if [ ! -f "$ASR_BIN" ]; then
            echo "❌ 未找到 PyInstaller 产物: $ASR_BIN"
            exit 1
          fi

          FULL_STAGE="$RUNNER_TEMP/dmg_stage/full"
          rm -rf "$FULL_STAGE" && mkdir -p "$FULL_STAGE"

          cp -R "$APP_BUNDLE_PATH" "$FULL_STAGE/"
          FULL_APP="$FULL_STAGE/$(basename "$APP_BUNDLE_PATH")"

          mkdir -p "$FULL_APP/Contents/Resources"
          cp "$ASR_BIN" "$FULL_APP/Contents/Resources/asr_server"
          chmod +x "$FULL_APP/Contents/Resources/asr_server"

          codesign --force --deep --sign - "$FULL_APP"

          create-dmg \
            --volname "Hermeneus (Full)" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Hermeneus-macOS-v${VERSION}-Full.dmg" \
            "$FULL_APP" || true

          if [ ! -f "Hermeneus-macOS-v${VERSION}-Full.dmg" ]; then
            echo "❌ create-dmg 执行失败，且未生成 Full DMG 产物"
            exit 1
          fi
          echo "✅ Full DMG 产物校验通过: Hermeneus-macOS-v${VERSION}-Full.dmg"

      - name: Upload DMG Artifacts (for manual runs / QA)
        uses: actions/upload-artifact@v4
        with:
          name: Hermeneus-DMG-${{ steps.version.outputs.VERSION }}
          path: |
            Hermeneus-macOS-v*-Full.dmg
            Hermeneus-v*-Lite.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            Hermeneus-macOS-v*-Full.dmg
            Hermeneus-v*-Lite.zip

      - name: Upload DMGs to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Hermeneus-传译者 v${{ steps.version.outputs.VERSION }}"
          files: |
            Hermeneus-macOS-v*-Full.dmg
            Hermeneus-v*-Lite.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}