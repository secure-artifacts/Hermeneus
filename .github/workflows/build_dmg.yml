name: Build M-Chip DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-macOS-arm64:
    runs-on: macos-14
    permissions:
      contents: write      # softprops/action-gh-release 需要写权限才能创建 Release、上传文件
      id-token: write      # actions/attest-build-provenance 需要用来签发 OIDC token
      attestations: write  # actions/attest-build-provenance 需要写权限才能生成构件证明

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build ASR Server Executable (ARM64)
        run: |
          cd asr_server
          pyinstaller --clean --onefile --name asr_server \
            --collect-all funasr \
            --collect-all faster_whisper \
            --collect-all torch \
            --collect-all ctranslate2 \
            server.py
          mkdir -p ../HermeneusApp/Sources/Resources/
          cp dist/asr_server ../HermeneusApp/Sources/Resources/ || true

      - name: Install create-dmg tool
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install create-dmg

      - name: Build SwiftUI App for Apple Silicon
        run: |
          cd HermeneusApp
          XCODEPROJ=$(find . -name "*.xcodeproj" -not -path "*/.*" | head -n 1)
          SWIFTPKG=$(find . -name "Package.swift" -not -path "*/.*" | head -n 1)
          
          if [ -n "$XCODEPROJ" ]; then
            SCHEME_NAME=$(xcodebuild -list -project "$XCODEPROJ" | grep -A 10 "Schemes:" | tail -n +2 | tr -d " " | head -n 1)
            echo "🚀 递归检索到 Xcode 工程: $XCODEPROJ, 提取 Scheme: $SCHEME_NAME"
            xcodebuild -project "$XCODEPROJ" -scheme "$SCHEME_NAME" -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -arch arm64 SWIFT_STRICT_CONCURRENCY=minimal
          elif [ -n "$SWIFTPKG" ]; then
            PKG_DIR=$(dirname "$SWIFTPKG")
            echo "🚀 递归检索到 Swift Package 目录: $PKG_DIR"
            cd "$PKG_DIR"
            swift build -c release --arch arm64 -Xswiftc -strict-concurrency=minimal

            # swift build 只会产出一个裸的可执行文件，不会像 xcodebuild 那样
            # 自动打出 macOS 需要的 .app 包（Contents/MacOS + Info.plist 等），
            # 所以这里手动组装一个最小可用的 .app bundle。
            EXECUTABLE_NAME="AILiveInterpreterApp"
            APP_NAME="Hermeneus"
            APP_BUNDLE="${APP_NAME}.app"
            BIN_PATH=$(swift build -c release --arch arm64 --show-bin-path)

            echo "📦 手动组装 .app bundle: $PKG_DIR/$APP_BUNDLE"
            rm -rf "$APP_BUNDLE"
            mkdir -p "$APP_BUNDLE/Contents/MacOS"
            mkdir -p "$APP_BUNDLE/Contents/Resources"

            cp "$BIN_PATH/$EXECUTABLE_NAME" "$APP_BUNDLE/Contents/MacOS/$EXECUTABLE_NAME"

            # 如果 SPM 产物里带了资源 bundle（图片/本地化等），一并拷进去
            if [ -d "$BIN_PATH/${EXECUTABLE_NAME}_${EXECUTABLE_NAME}.bundle" ]; then
              cp -R "$BIN_PATH/${EXECUTABLE_NAME}_${EXECUTABLE_NAME}.bundle" "$APP_BUNDLE/Contents/Resources/"
            fi

            # asr_server 是前面 pyinstaller 打进 Sources/Resources 的，同样需要跟着进 app 包
            if [ -f "Sources/Resources/asr_server" ]; then
              cp "Sources/Resources/asr_server" "$APP_BUNDLE/Contents/Resources/asr_server"
              chmod +x "$APP_BUNDLE/Contents/Resources/asr_server"
            fi

            cat > "$APP_BUNDLE/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$EXECUTABLE_NAME</string>
              <key>CFBundleIdentifier</key>
              <string>com.hermeneus.ailiveinterpreter</string>
              <key>CFBundleName</key>
              <string>$APP_NAME</string>
              <key>CFBundleDisplayName</key>
              <string>$APP_NAME</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>需要访问麦克风以进行实时语音同传</string>
          </dict>
          </plist>
          EOF

            # ad-hoc 签名：不需要开发者证书，主要是避免从 GitHub Release 下载后
            # 被 Gatekeeper 判定为"已损坏"（下载会带 quarantine 标记）
            codesign --force --deep --sign - "$APP_BUNDLE" || true

            echo "✅ .app bundle 组装完成: $(pwd)/$APP_BUNDLE"
          else
            echo "❌ 未找到 Swift 项目！"
            exit 1
          fi

      - name: Package into DMG
        run: |
          APP_PATH=$(find HermeneusApp -name "*.app" -not -path "*/.*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find HermeneusApp -name "*AILiveInterpreter*" -o -name "*Hermeneus*" | grep -E "\.app$" | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到编译生成的 .app 文件！"
            exit 1
          fi
          echo "✅ 找到 Target App 路径: $APP_PATH"
          create-dmg \
            --volname "Hermeneus" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "Hermeneus-AppleSilicon.dmg" \
            "$APP_PATH"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "Hermeneus-AppleSilicon.dmg"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Hermeneus-AppleSilicon.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}